<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            text-align: center;
            color: #333333;
        }
        .voter-list, .results {
            margin: 20px 0;
        }
        .voter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f1f1f1;
            border: 1px solid #dddddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .voter span {
            font-size: 14px;
            color: #555555;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results .result {
            padding: 10px;
            background-color: #e9ecef;
            border: 1px solid #dddddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .note {
            font-size: 14px;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voting Page</h1>

        <div class="voter-list">
            <h2>Registered Voters</h2>
            <div id="voters-container"></div>
        </div>

        <div class="results">
            <h2>Live Results</h2>
            <div id="results-container"></div>
        </div>

        <p class="note">Note: Results update automatically after each vote.</p>
    </div>
    <script src="/static/frontend.js"></script>
</body>
</html>
